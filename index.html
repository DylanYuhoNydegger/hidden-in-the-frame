<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Which paintings should you see in a museum – and what is hidden in them? Free museum guides for art lovers who aren't experts. German · English · Japanese.">
<meta property="og:title" content="Hidden in the Frame">
<meta property="og:description" content="The must-see paintings of famous museums, their stories and the hidden details to look for. Free guides in German, English and Japanese.">
<meta property="og:image" content="https://dylanyuhonydegger.github.io/hidden-in-the-frame/og.jpg">
<meta property="og:type" content="website">
<meta property="og:url" content="https://dylanyuhonydegger.github.io/hidden-in-the-frame/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C3A3F">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Hidden in the Frame</title>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Work+Sans:wght@400;500;600&family=Noto+Serif+JP:wght@500;700&display=swap">
<style>
/* Layout: a salon-hung gallery wall opens the page; a pinned world map leads into each museum; museum pages read like wall labels */
:root{
  --wall:#ECEDEA; --plaster:#F7F7F4; --ink:#1E2326; --stone:#5E6E74; --land:#D3D9D8; --gold:#9A7426; --gold-ink:#7A5A16; --line:#D6DAD8; --salon:#2C3A3F; --salon-ink:#EDEBE4; --frame:#B38B3A;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --jp:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--wall:#15191B;--plaster:#1C2124;--ink:#E7E6E1;--stone:#9AAAB0;--land:#2E373B;--gold:#D2AE5E;--gold-ink:#E2C27A;--line:#2C3438;--salon:#101517;--salon-ink:#EDEBE4;--frame:#C9A24E;color-scheme:dark}}
:root[data-theme="dark"]{--wall:#15191B;--plaster:#1C2124;--ink:#E7E6E1;--stone:#9AAAB0;--land:#2E373B;--gold:#D2AE5E;--gold-ink:#E2C27A;--line:#2C3438;--salon:#101517;--salon-ink:#EDEBE4;--frame:#C9A24E;color-scheme:dark}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
body.ja{font-family:var(--body),var(--jp)}
body.ja h1,body.ja h2,body.ja h3,body.ja .meaning,body.ja .label .n,body.ja .facts .y{font-family:"Noto Serif JP",var(--jp),serif;font-style:normal}
body.ja em,body.ja i{font-style:normal}
body.ja .salon h1{font-size:clamp(1.6rem,3.4vw,2.7rem);line-height:1.4;letter-spacing:.04em}
body.ja .salon h1 .ln{display:block;white-space:nowrap}
body.ja h1,body.ja h2,body.ja h3,body.ja p,body.ja li,body.ja .m h3{word-break:auto-phrase;line-break:strict}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wall)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--wall);border-bottom:1px solid var(--line)}
header.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{font-family:var(--display);font-weight:700;font-size:1.35rem;color:var(--ink);text-decoration:none}
.logo i{color:var(--gold);font-style:italic;font-weight:500}
.langs{display:flex;gap:4px}
.langs button{font:500 .78rem/1 var(--body);letter-spacing:.08em;padding:8px 10px;border:1px solid var(--line);background:transparent;color:var(--stone);border-radius:2px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--wall);border-color:var(--ink)}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.eyebrow{font:600 .72rem/1.3 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink)}
h1,h2,h3{font-family:var(--display);font-weight:500;text-wrap:balance;margin:0}

/* salon hero */
.salon{background:var(--salon);color:var(--salon-ink)}
.salon .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:36px;align-items:center;padding-block:48px}
@media (max-width:820px){.salon .wrap{grid-template-columns:minmax(0,1fr);gap:24px;padding-block:28px}}
.salon h1{font-size:clamp(2.3rem,5.6vw,4rem);line-height:1.04;color:var(--salon-ink)}
.salon h1 em{color:var(--frame);font-style:italic}
.salon p{color:color-mix(in srgb,var(--salon-ink) 78%,transparent);font-size:1.05rem;max-width:52ch;margin:14px 0 0}
.salon .eyebrow{color:var(--frame)}
.hang{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:44px;gap:10px}
.hang a{display:block;border:5px solid var(--frame);box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.35);background:#111 center/cover no-repeat;min-width:0}
.hang a.round{border-radius:50%}
@media (prefers-reduced-motion:no-preference){.hang a{transition:transform .3s ease}.hang a:hover{transform:translateY(-3px)}}
.cta{display:inline-flex;margin-top:20px;gap:10px;flex-wrap:wrap}
.btn{font:600 .85rem/1 var(--body);letter-spacing:.04em;padding:12px 16px;border-radius:2px;text-decoration:none;cursor:pointer;border:1px solid var(--frame);background:var(--frame);color:#1a1408}
.btn.ghost{background:transparent;color:inherit}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:default}

/* map */
.mapsec{padding-block:44px 24px;display:grid;gap:14px}
.mapsec h2{font-size:clamp(1.6rem,4vw,2.4rem)}
.mapbox{position:relative;background:var(--plaster);border:1px solid var(--line);overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto;touch-action:none}
.land{fill:var(--land);stroke:var(--wall);stroke-width:.5}
.pin{cursor:default}
.pin circle.dot{fill:var(--stone)}
.pin.live{cursor:pointer}
.pin.live circle.dot{fill:var(--gold)}
.pin circle.halo{fill:none;stroke:var(--gold);stroke-width:1.5}
.pin text{font:600 11px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--plaster);stroke-width:3px}
.pin.soon text{fill:var(--stone);font-weight:500}
@media (prefers-reduced-motion:no-preference){.pin circle.halo{animation:pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3)}}}
.mapctl{position:absolute;right:10px;top:10px;display:flex;gap:4px}
.mapctl button{font:500 .75rem/1 var(--body);padding:7px 9px;border:1px solid var(--line);background:var(--plaster);color:var(--ink);border-radius:2px;cursor:pointer}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.85rem;color:var(--stone)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--stone)}
.legend span.l::before{background:var(--gold)}
.museums{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding-block:8px 56px}
.m{display:grid;gap:4px;padding:16px;border:1px solid var(--line);background:var(--plaster);text-decoration:none;color:var(--ink);min-width:0}
.m h3{font-size:1.25rem}.m .city{color:var(--stone);font-size:.9rem}
.m .st{font:600 .7rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase;margin-top:8px}
.m.live .st{color:var(--gold-ink)}.m.soon{opacity:.62}.m.soon .st{color:var(--stone)}.m.live:hover{border-color:var(--gold)}

/* museum page */
.mhead{padding-block:36px 8px;display:grid;gap:10px}
.mhead h1{font-size:clamp(2.1rem,5.4vw,3.4rem);line-height:1.06}
.mhead p{margin:0;color:var(--stone);max-width:64ch}
.back{color:var(--stone);text-decoration:none;font-size:.9rem}
.panel{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;padding-block:20px 8px}
@media (max-width:820px){.panel{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--plaster);border:1px solid var(--line);padding:18px;display:grid;gap:12px;align-content:start;min-width:0}
.box h2{font-size:1.4rem}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.facts li{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px}
.facts .y{font-family:var(--display);font-size:1.15rem;color:var(--gold-ink);font-variant-numeric:tabular-nums}
.visit{display:grid;gap:8px;margin:0}
.visit div{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.visit dt{color:var(--stone);font-size:.88rem}.visit dd{margin:0;font-size:.92rem}
.small{font-size:.8rem;color:var(--stone);margin:0}
.small a{color:var(--gold-ink)}
.dl{display:flex;gap:8px;flex-wrap:wrap}
.dl .btn{background:var(--ink);border-color:var(--ink);color:var(--wall)}
.dl .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.status{font-size:.82rem;color:var(--stone);min-height:1.2em;margin:0}
.index{display:flex;flex-wrap:wrap;gap:6px;padding-block:20px 24px}
.index a{font-size:.85rem;color:var(--ink);text-decoration:none;padding:6px 10px;border:1px solid var(--line);border-radius:2px;background:var(--plaster)}
.index a span{color:var(--gold-ink);margin-right:6px;font-variant-numeric:tabular-nums}
article.work{padding-block:36px;border-top:1px solid var(--line);display:grid;gap:18px;scroll-margin-top:80px}
.label{display:grid;gap:2px}
.label .n{font-family:var(--display);font-style:italic;color:var(--gold);font-size:1.1rem}
.label h2{font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.12}
.label .meta{color:var(--stone);font-size:.92rem}
figure{margin:0;background:var(--plaster);border:1px solid var(--line);padding:10px}
figure img{display:block;width:100%;height:auto}
figure figcaption{font-size:.78rem;color:var(--stone);padding-top:8px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
.story p{margin:0;max-width:62ch}
ol.det{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:12px;counter-reset:d}
ol.det li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px}
ol.det li::before{counter-increment:d;content:counter(d);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--wall);font:600 .78rem/1 var(--body);margin-top:2px}
.meaning{margin:0;padding:16px 18px;background:var(--plaster);border:1px solid var(--line);font-family:var(--display);font-style:italic;font-size:1.08rem;line-height:1.5}
.meaning b{font-family:var(--body);font-style:normal;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);display:block;margin-bottom:6px;font-weight:600}
footer{border-top:1px solid var(--line);padding-block:28px;color:var(--stone);font-size:.82rem}
footer p{margin:0 0 6px;max-width:72ch}

.pic{position:relative;width:100%;max-width:100%}
.pic img{position:absolute;inset:0;width:100%;height:100%}
.hot{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1;border-radius:50%;border:3px solid var(--gold);background:transparent;box-shadow:0 0 0 1.5px rgba(0,0,0,.55),inset 0 0 0 1.5px rgba(0,0,0,.35);cursor:zoom-in;padding:0;min-width:28px}
.hot span{position:absolute;right:-4px;top:-4px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#1a1408;font:700 .72rem/22px var(--body);text-align:center;box-shadow:0 0 0 1.5px rgba(0,0,0,.5)}
.hot:hover,.hot:focus-visible{border-color:#fff}
.look{font:600 .78rem/1 var(--body);color:var(--gold-ink);background:none;border:0;padding:4px 0;cursor:pointer;white-space:nowrap}
.tour{display:grid;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:500 .85rem/1 var(--body);padding:10px 12px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:2px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--wall);border-color:var(--ink)}
ol.route{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}
ol.route a{display:grid;grid-template-columns:28px minmax(0,1fr);gap:2px 8px;padding:10px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--wall)}
ol.route .rn{grid-row:1/3;font-family:var(--display);font-size:1.3rem;color:var(--gold-ink);font-variant-numeric:tabular-nums}
ol.route .rr{font-size:.8rem;color:var(--stone)}
.zv{position:fixed;inset:0;z-index:20;background:rgba(8,10,11,.94);display:grid;grid-template-rows:auto minmax(0,1fr) auto;color:#EDEBE4;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.zv[hidden]{display:none!important}
.zv .zt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.zv .zt span{font:500 .85rem var(--body);opacity:.8}
.zv button.zb{font:600 .85rem/1 var(--body);padding:10px 14px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#EDEBE4;border-radius:2px;cursor:pointer}
.zs{position:relative;overflow:hidden;touch-action:none}
.zs .zi{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.zs .zi img{display:block;width:100%;height:100%}
.zs .ring{position:absolute;border:3px solid #E8C770;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 40px rgba(0,0,0,.6);pointer-events:none}
@media (prefers-reduced-motion:no-preference){.zs .zi{transition:transform .7s cubic-bezier(.4,0,.2,1)}.zs .ring{transition:all .7s cubic-bezier(.4,0,.2,1)}}
.zp{max-height:38vh;overflow:auto;padding-block:12px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid rgba(255,255,255,.15)}
.zp p{margin:0 auto;max-width:68ch;font-size:1rem;line-height:1.55}
.zp .zn{display:flex;gap:8px;justify-content:center;margin-top:12px}

.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font:600 .7rem/1 var(--body);letter-spacing:.06em;padding:6px 9px;border-radius:999px;border:1px solid var(--line);color:var(--stone);text-decoration:none}
.pill.on{color:#2F6B4F;border-color:color-mix(in srgb,#2F6B4F 40%,transparent)}
.pill.loan,.pill.resto{color:#9A4B1C;border-color:color-mix(in srgb,#9A4B1C 40%,transparent)}
.pill.yt{color:var(--gold-ink);border-color:var(--gold)}
.gamebtn{justify-self:start;background:transparent;color:var(--ink);border-color:var(--gold)}
.gv{position:fixed;inset:0;z-index:21;background:rgba(8,10,11,.95);color:#EDEBE4;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.gv[hidden]{display:none!important}
.gq{text-align:center;padding:6px 16px 10px;font-size:1.05rem}
.gq b{color:#E8C770}
.gs{position:relative;display:grid;place-items:center;overflow:hidden;padding:0 12px}
.gs .gw{position:relative;max-width:100%;max-height:100%}
.gs img{display:block;max-width:100%;max-height:calc(100vh - 230px);cursor:crosshair;user-select:none;-webkit-user-select:none}
.gs .gring{position:absolute;border:3px solid #E8C770;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.6);transform:translate(-50%,-50%);pointer-events:none}
.gs .gtap{position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid #fff;transform:translate(-50%,-50%);pointer-events:none}
.gf{padding:10px 16px 14px;text-align:center;display:grid;gap:10px;justify-items:center}
.gf p{margin:0;max-width:64ch;font-size:.95rem}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.on{color:#7CC4A0}:root:not([data-theme="light"]) .pill.loan,:root:not([data-theme="light"]) .pill.resto{color:#E59A6A}}
:root[data-theme="dark"] .pill.on{color:#7CC4A0}:root[data-theme="dark"] .pill.loan,:root[data-theme="dark"] .pill.resto{color:#E59A6A}

.ap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;background:var(--plaster);border:1px solid var(--line)}
.apb{width:44px;height:44px;border-radius:50%;border:0;background:var(--gold);color:var(--wall);display:grid;place-items:center;cursor:pointer;flex:none}
.apb svg{width:20px;height:20px;fill:currentColor}
.apb .i-pause{display:none}.ap.playing .apb .i-play{display:none}.ap.playing .apb .i-pause{display:inline}
.apm{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;min-width:0}
.apt{font-size:.82rem;color:var(--stone);grid-column:1/-1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apt b{color:var(--ink);font-weight:600}
.aptime{font-size:.78rem;color:var(--stone);font-variant-numeric:tabular-nums;white-space:nowrap}
.apr{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(var(--gold),var(--gold)) 0/var(--p,0%) 100% no-repeat,var(--line);cursor:pointer;margin:0}
.apr::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--gold);border:2px solid var(--plaster)}
.apr::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid var(--plaster)}

.about{padding-block:8px 64px}
.about-in{display:grid;gap:12px;max-width:68ch;border-top:1px solid var(--line);padding-top:36px}
.about-in h2{font-size:clamp(1.6rem,4vw,2.3rem)}
.about-in p{margin:0}

.look .leadp{font-size:1.08rem;max-width:62ch}
ol.steps{list-style:none;margin:16px 0 8px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
ol.steps li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:16px;background:var(--plaster);border:1px solid var(--line)}
ol.steps .sn{font-family:var(--display);font-size:2rem;line-height:1;color:var(--gold)}
ol.steps h3{font-size:1.15rem;line-height:1.25;margin-bottom:6px}
ol.steps p{margin:0;font-size:.95rem}
ul.tips{margin:0;padding-left:18px;display:grid;gap:8px}

.guided{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:center;margin-top:10px;padding:16px;border:1px solid var(--gold);background:var(--plaster)}
@media (max-width:720px){.guided{grid-template-columns:minmax(0,1fr)}}
.guided .ap{border:0;padding:0;background:transparent}

.apsub{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:.76rem;color:var(--stone)}
.apskip{font:600 .76rem/1 var(--body);color:var(--gold-ink);background:none;border:0;padding:4px 0;cursor:pointer}

.hangwrap{position:relative;padding-bottom:30px;--x:60%;--y:35%;--r:150px}
.dark{position:absolute;inset:-14px;pointer-events:none;background:radial-gradient(circle var(--r) at var(--x) var(--y),rgba(16,21,23,0) 0,rgba(16,21,23,0) 45%,rgba(9,12,13,.93) 100%);transition:background .15s linear}
.hangwrap.lit .dark{background:radial-gradient(circle var(--r) at var(--x) var(--y),rgba(16,21,23,0) 0,rgba(16,21,23,0) 45%,rgba(9,12,13,.93) 100%)}
.sig{position:absolute;right:4px;bottom:2px;font:italic 500 .8rem/1 var(--display);letter-spacing:.12em;color:#8C7A55;background:none;border:0;padding:4px;cursor:pointer;opacity:.75}
.sig i{font-style:italic}
.lamp{position:absolute;left:0;right:0;top:calc(100% + 8px);margin:0;text-align:center;font-size:.78rem;color:color-mix(in srgb,var(--salon-ink) 60%,transparent)}

 de:{inside:"Du stehst jetzt in: %s",pvback:"← Zurück ins Museum",pvhint:"Ziehen oder Maus bewegen, um dich umzusehen · Pfeiltasten ← →",portalhint:"Manche Bilder leuchten. Tippe darauf – und tritt ein.",wingsk:"Ungefähre Skizze, keine echte Aufnahme: So kurz waren Leonardos Flügel ungefähr – der gestrichelte Teil kam später dazu.",wingoff:"Skizze ausblenden",wingon:"Skizze zeigen",hours:"Geöffnet täglich · Nachtführung 0–1 Uhr (deine Ortszeit)",midnight:"Mitternacht. Das Museum ist geschlossen – aber du bist noch drin.",rope:"Bitte nicht so nah! – Ihr Museumswärter",dustdone:"Freigelegt: Leonardo malte kurze, kräftige Flügel wie bei einem Raubvogel. Ein anderer Maler hat sie später nach hinten verlängert – Spuren davon sieht man bei genauem Hinsehen noch.",swl:"Saal-Licht",guard:"Bitte nicht berühren! – Ihr Museumswärter",night:"Nachtführung",nightoff:"Licht an",nighthint:"Du bist jetzt allein im Museum. Taschenlampe an – Licht an mit dem Schalter unten.",lamp:"Bewege die Maus oder den Finger – wie mit einer Taschenlampe im dunklen Museum.",found:"Gefunden! Wie Caravaggio in der Weinkaraffe hat sich auch der Macher dieser Seite versteckt: D·N fecit – „D. N. hat es gemacht“.",abegg:"Wie Caravaggio habe ich mich auf dieser Seite versteckt. Findest du mich?",abtag:"Über das Projekt",abh:"Hallo, ich bin Dylan.",abp:["Ich studiere Elektrotechnik und Informationstechnologie an der ETH Zürich. Mit Kunst habe ich beruflich nichts zu tun – aber ich finde sie spannend.","Die Idee entstand, als meine Eltern in den Uffizien waren: Sie wollten wissen, welche Bilder man gesehen haben muss und was darin eigentlich steckt. Einen Guide, der beides kurz und verständlich erklärt, haben wir nicht gefunden. Also habe ich ihn gemacht.","Hidden in the Frame ist für alle, die Kunst mögen, aber keine Fachleute sind. Ich schreibe auf Deutsch, Englisch und Japanisch, und nach und nach kommen weitere Museen dazu."],abai:"Recherche, Texte und Bilder entstehen mit Unterstützung von KI und werden mit Quellen geprüft. Fehler gefunden? Sag es mir gerne.",tag:"Museumsguides",h1:"Schau genauer hin. Die Werke, die man <em>nicht verpassen</em> darf.",lead:"Für alle, die Kunst lieben, aber keine Fachleute sind: die wichtigsten Werke berühmter Museen, ihre Geschichte und die Details, nach denen man vor dem Bild suchen sollte.",start:"Zu den Uffizien",yt:"YouTube",ytsoon:"YouTube – bald",map:"Weltkarte",maph:"Wähle ein Museum",world:"Welt",europe:"Europa",lg1:"Guide verfügbar",lg2:"In Arbeit",live:"Guide lesen",soon:"Bald",back:"← Alle Museen",works:"Werke",story:"Die Geschichte",det:"Details im Bild",mean:"Was das Bild sagt",intro:"Die gelben Kreise zeigen, wo die Details sind. Die Nummer im Bild entspricht der Nummer im Text.",fig:"Gemeinfrei. Markierungen: Hidden in the Frame.",about:"Über die Uffizien",visit:"Besuch planen",pdf:"Guide als PDF – gratis",pdfnote:"Alle Werke mit Geschichte und markierten Details, zum Ausdrucken oder fürs Handy.",dlna:"Download ist in dieser Ansicht nicht verfügbar.",saved:"Gespeichert.",declined:"Download abgebrochen.",must:"Die Must-Sees",checked:"Stand: November 2026. Zeiten und Preise ändern sich – vor dem Besuch auf",check2:"prüfen.",foot1:"Alle Gemälde sind gemeinfrei. Texte und Markierungen: Hidden in the Frame.",foot2:"Werke werden manchmal verliehen oder umgehängt. Stand der Angaben: November 2026."},
 en:{inside:"You are now inside: %s",pvback:"← Back to the museum",pvhint:"Drag or move your mouse to look around · arrow keys ← →",portalhint:"Some paintings are glowing. Tap one – and step inside.",wingsk:"Rough sketch, not a real scan: roughly how short Leonardo’s wings were – the dashed part was added later.",wingoff:"Hide sketch",wingon:"Show sketch",hours:"Open daily · Night tour 12–1 am (your local time)",midnight:"Midnight. The museum is closed – but you are still inside.",rope:"Please, not so close! – Your museum guard",dustdone:"Uncovered: Leonardo painted short, powerful wings like a bird of prey’s. Another painter later lengthened them – look closely and you can still see traces.",swl:"Gallery lights",guard:"Please do not touch! – Your museum guard",night:"Night tour",nightoff:"Lights on",nighthint:"You are alone in the museum now. Torch on – turn the lights back on with the switch at the bottom.",lamp:"Move your mouse or finger – like a torch in a dark museum.",found:"Found! Just like Caravaggio in the wine carafe, the maker of this site hid himself here: D·N fecit – “D. N. made it”.",abegg:"Like Caravaggio, I have hidden myself somewhere on this site. Can you find me?",abtag:"About the project",abh:"Hi, I'm Dylan.",abp:["I study electrical engineering and information technology at ETH Zurich. Art isn't my job – but I find it fascinating.","The idea came when my parents visited the Uffizi: they wanted to know which paintings you have to see and what is actually hidden in them. We couldn't find a guide that explained both briefly and clearly. So I made one.","Hidden in the Frame is for everyone who likes art but isn't an expert. I write in German, English and Japanese, and more museums are added step by step."],abai:"Research, texts and images are made with the help of AI and checked against sources. Spotted a mistake? Please let me know.",tag:"Museum guides",h1:"Look closer. The works you <em>must not miss</em>.",lead:"For anyone who loves art but isn't an expert: the key works of famous museums, their stories, and the details to look for when you stand in front of them.",start:"Explore the Uffizi",yt:"YouTube",ytsoon:"YouTube – soon",map:"World map",maph:"Pick a museum",world:"World",europe:"Europe",lg1:"Guide available",lg2:"In progress",live:"Read the guide",soon:"Soon",back:"← All museums",works:"works",story:"The story",det:"Details in the picture",mean:"What it says",intro:"The yellow circles show where each detail is. The number in the picture matches the number in the text.",fig:"Public domain. Markings: Hidden in the Frame.",about:"About the Uffizi",visit:"Plan your visit",pdf:"Guide as PDF – free",pdfnote:"Every work with its story and marked details, to print or read on your phone.",dlna:"Downloads aren't available in this view.",saved:"Saved.",declined:"Download cancelled.",must:"The must-sees",checked:"As of November 2026. Hours and prices change – check",check2:"before you go.",foot1:"All paintings are in the public domain. Texts and markings: Hidden in the Frame.",foot2:"Works are sometimes lent out or rehung. Information as of November 2026."},
 ja:{inside:"あなたは今、《%s》の中にいます",pvback:"← 美術館に戻る",pvhint:"ドラッグまたはマウスを動かして見回せます・矢印キー ← →",portalhint:"光っている絵があります。タップして、中へ入ってみましょう。",wingsk:"おおよそのスケッチで、実際の調査画像ではありません。レオナルドの翼はこのくらい短く、点線の部分は後から描き足されました。",wingoff:"スケッチを隠す",wingon:"スケッチを表示",hours:"毎日開館・ナイトツアー 0〜1時（現地時間）",midnight:"真夜中。美術館は閉館しました。でも、あなたはまだ中にいます。",rope:"近づきすぎないでください！ ― 警備員より",dustdone:"発見：レオナルドは猛禽のような短く力強い翼を描きました。のちに別の画家が後ろへ長く描き足したのです。よく見ると、その痕跡が今も残っています。",swl:"展示室の照明",guard:"作品に触れないでください！ ― 警備員より",night:"ナイトツアー",nightoff:"明かりをつける",nighthint:"今、美術館にいるのはあなただけ。懐中電灯をどうぞ。下のスイッチで明かりが戻ります。",lamp:"マウスや指を動かしてみてください。暗い美術館で懐中電灯を照らすように。",found:"見つけた！ワインのカラフェに隠れたカラヴァッジョのように、このサイトの作者もここに隠れていました。D·N fecit（D・Nがこれを作った）。",abegg:"カラヴァッジョのように、私もこのサイトのどこかに隠れています。見つけられますか？",abtag:"このプロジェクトについて",abh:"こんにちは、ディランです。",abp:["チューリッヒ工科大学（ETH）で電気工学と情報技術を学んでいます。美術は専門ではありませんが、とても面白いと思っています。","きっかけは、両親がウフィツィ美術館を訪れたことでした。どの絵を見るべきか、そしてその絵に何が隠されているのかを知りたがっていました。それを短く分かりやすく説明してくれるガイドが見つからなかったので、自分で作ることにしました。","Hidden in the Frameは、美術が好きだけれど専門家ではないすべての人のためのものです。ドイツ語・英語・日本語で書いていて、美術館を少しずつ増やしていきます。"],abai:"調査・文章・画像はAIの助けを借りて作成し、出典で確認しています。間違いを見つけたら、ぜひ教えてください。",tag:"美術館ガイド",h1:"<span class='ln'>もっと近くで見よう。</span><span class='ln'>見逃してはいけない</span><span class='ln'><em>名画</em>。</span>",lead:"美術は好きだけれど専門家ではない人のために。有名な美術館の必見の作品、その物語、そして絵の前で探すべき見どころを紹介します。",start:"ウフィツィ美術館へ",yt:"YouTube",ytsoon:"YouTube – 近日公開",map:"世界地図",maph:"美術館を選ぶ",world:"世界",europe:"ヨーロッパ",lg1:"ガイドあり",lg2:"準備中",live:"ガイドを読む",soon:"近日公開",back:"← すべての美術館",works:"作品",story:"物語",det:"絵の中の見どころ",mean:"この絵が語ること",intro:"黄色い円が見どころの場所です。絵の中の番号は本文の番号に対応しています。",fig:"パブリックドメイン。マーキング：Hidden in the Frame。",about:"ウフィツィ美術館について",visit:"訪問の準備",pdf:"PDFガイド（無料）",pdfnote:"すべての作品の物語と見どころ付き。印刷にもスマホにも。",dlna:"この表示ではダウンロードできません。",saved:"保存しました。",declined:"ダウンロードを中止しました。",must:"必見の名画",checked:"2026年11月現在。開館時間と料金は変わることがあります。訪問前に",check2:"で確認してください。",foot1:"すべての絵画はパブリックドメインです。文章とマーキング：Hidden in the Frame。",foot2:"作品は貸し出されたり展示替えされることがあります。2026年11月現在の情報です。"}

const FACTS={louvre:{"de": [["um 1190", "König Philipp II. August lässt eine Festung mit einem mächtigen Turm bauen, um Paris zu schützen. Ihre Mauern kannst du im Untergeschoss noch sehen."], ["1546", "Franz I. lässt die Burg abreissen und einen Renaissance-Palast bauen. Er hatte schon Leonardos Gemälde gesammelt – darunter die Mona Lisa."], ["1682", "Ludwig XIV. zieht nach Versailles. Der Louvre wird zum Sitz der Akademien und Künstler."], ["1793", "Mitten in der Revolution öffnet der Louvre als öffentliches Museum. Die Königssammlung gehört jetzt dem Volk."], ["1911", "Die Mona Lisa wird gestohlen und taucht erst 1913 in Florenz wieder auf."], ["1989", "Die Glaspyramide von I. M. Pei wird eröffnet, damals heftig umstritten, heute ein Wahrzeichen."], ["2025", "Im Oktober stehlen Diebe in wenigen Minuten acht Stücke der französischen Kronjuwelen aus der Apollon-Galerie. Im Januar war der Umbau „Louvre Nouvelle Renaissance“ angekündigt worden: neuer Eingang und ein eigener Saal für die Mona Lisa, geplant bis etwa 2031."]], "en": [["c. 1190", "King Philip II Augustus builds a fortress with a mighty keep to protect Paris. You can still see its walls in the basement."], ["1546", "Francis I has the castle torn down and a Renaissance palace built. He had already collected Leonardo's paintings – including the Mona Lisa."], ["1682", "Louis XIV moves to Versailles. The Louvre becomes home to the academies and artists."], ["1793", "In the middle of the Revolution the Louvre opens as a public museum. The royal collection now belongs to the people."], ["1911", "The Mona Lisa is stolen and only turns up again in Florence in 1913."], ["1989", "I. M. Pei's glass pyramid opens – fiercely debated then, a landmark today."], ["2025", "In October thieves steal eight pieces of the French Crown Jewels from the Apollo Gallery in a matter of minutes. In January the “Louvre New Renaissance” project had been announced: a new entrance and a room of its own for the Mona Lisa, planned for around 2031."]], "ja": [["1190年頃", "国王フィリップ2世がパリを守るため、巨大な主塔を備えた要塞を築きます。その城壁は今も地下で見ることができます。"], ["1546年", "フランソワ1世が城を取り壊し、ルネサンス様式の宮殿を建て始めます。彼はすでにモナ・リザを含むレオナルドの絵を集めていました。"], ["1682年", "ルイ14世がヴェルサイユへ移り、ルーヴルはアカデミーや芸術家の拠点になります。"], ["1793年", "革命のさなか、ルーヴルは公共の美術館として開館。王のコレクションは国民のものになりました。"], ["1911年", "モナ・リザが盗まれ、1913年にフィレンツェで見つかります。"], ["1989年", "I・M・ペイのガラスのピラミッドが完成。当時は激しい論争を呼びましたが、今ではシンボルです。"], ["2025年", "10月、窃盗団がわずか数分でアポロンのギャラリーからフランス王冠の宝飾品8点を盗み出します。同年1月には改修計画「ルーヴル・ヌーヴェル・ルネサンス」が発表されました。新しい入口とモナ・リザ専用の展示室を2031年頃までに整備する予定です。"]]},uffizi:{
 de:[["1560","Giorgio Vasari beginnt den Bau für Cosimo I. de' Medici – als Amtsgebäude. „Uffizi“ heisst schlicht „Büros“. Fertig wird er 1581."],["1565","Der Vasari-Korridor entsteht in rund fünf Monaten: ein etwa 750 m langer, erhöhter Gang über den Ponte Vecchio bis zum Palazzo Pitti, gebaut zur Hochzeit von Francesco de' Medici mit Johanna von Österreich."],["1737","Anna Maria Luisa, die letzte Medici, vermacht die Sammlungen im „Familienpakt“ der Stadt – unter der Bedingung, dass sie Florenz nie verlassen."],["1769","Die Galerie öffnet für das Publikum – sie gehört zu den ältesten Museen Europas."],["1993","Am 27. Mai explodiert eine Autobombe der Mafia in der Via dei Georgofili: fünf Tote, fünf Werke zerstört, rund 30 beschädigt."],["2024","Der Vasari-Korridor öffnet am 21. Dezember nach acht Jahren wieder. Im selben Jahr zählen die Uffizien gut 5 Millionen Besuche."]],

const FIGS=[{"id": "bacchus", "from": "bacchus", "w": 200, "say": {"de": "Prost! … Äh, pssst. Ich war nie hier.", "en": "Cheers! … Er, shh. I was never here.", "ja": "乾杯！…あ、しーっ。僕はここにいなかったことに。"}}, {"id": "venus", "from": "venus", "w": 130, "say": {"de": "Endlich mal raus aus der Muschel.", "en": "Finally out of that shell.", "ja": "やっと貝殻から出られたわ。"}}, {"id": "medusa", "from": "medusa", "w": 150, "say": {"de": "Nicht anschauen! … Zu spät.", "en": "Don't look at me! … Too late.", "ja": "見ないで！…もう遅いわ。"}}, {"id": "dog", "from": "venus_urbino", "w": 130, "say": {"de": "Wuff. (Ich bewache hier eigentlich nichts.)", "en": "Woof. (I'm not actually guarding anything.)", "ja": "ワン。（実は何も見張ってないよ。）"}}, {"id": "flora", "from": "primavera", "w": 110, "say": {"de": "Hast du Zephyr gesehen? Sag ihm nicht, wo ich bin.", "en": "Have you seen Zephyr? Don't tell him where I am.", "ja": "ゼフュロスを見なかった？私の居場所は内緒よ。"}}, {"id": "federico", "from": "urbino", "w": 140, "say": {"de": "Bitte nur von links fotografieren.", "en": "Please only photograph me from the left.", "ja": "写真は左側からだけでお願いします。"}}];
const LOOK={"de": {"nav": "Richtig hinschauen", "tag": "Anleitung", "h": "Wie man ein Gemälde wirklich ansieht", "lead": "In einer Studie im Metropolitan Museum in New York blieben Besucher im Schnitt nur rund 27 Sekunden vor einem Meisterwerk stehen, die Hälfte sogar weniger als 17 Sekunden. In dieser Zeit sieht man das Bild, aber man schaut es nicht an. Diese Anleitung hilft dir, aus 17 Sekunden fünf gute Minuten zu machen.", "steps": [["Erst schauen, dann lesen", "Ignoriere zuerst das Schild neben dem Bild. Sonst suchst du nur noch das, was dort steht. Gib dir eine Minute, in der du nur schaust."], ["Beschreiben, was wirklich da ist", "Zähle im Kopf auf, was du siehst: Personen, Gegenstände, Farben, Licht. Noch keine Deutung, nur Fakten. „Ein junger Mann, ein Glas Wein, eine Schale Obst.“"], ["Mit den Augen wandern", "Geh nah heran und wieder zurück. Schau in die Ecken, in den Hintergrund, auf Hände und Gesichter. Wohin schauen die Figuren? Wohin fällt das Licht? Was ist hell, was liegt im Schatten?"], ["Fragen: Was passiert hier – und woran sehe ich das?", "Jetzt darfst du deuten. Aber begründe es mit etwas, das du siehst. „Er ist betrunken – das sehe ich an den roten Wangen und dem schiefen Wein im Glas.“"], ["Auf das achten, was nicht passt", "Ein zu langer Hals, eine Figur, die als Einzige zu dir schaut, faules Obst in einer Prachtschale: Das Seltsame ist fast immer Absicht – und oft der Schlüssel zum ganzen Bild."], ["Was wundert mich?", "Formuliere eine offene Frage. Warum ist sie so blass? Warum schaut er uns an? Mit einer Frage im Kopf schaust du automatisch genauer."], ["Jetzt erst lesen", "Lies das Schild oder den Guide und vergleiche mit deinen Vermutungen. Was hattest du richtig? Was hast du übersehen? Genau dieser Vergleich bleibt im Gedächtnis."], ["Ein Detail mitnehmen", "Merk dir ein einziges Detail, das du später erzählen kannst. Mehr braucht es nicht."]], "tipsh": "Tipps für den Museumsbesuch", "tips": ["Weniger ist mehr: Lieber 5 Bilder richtig als 50 im Vorbeigehen. Der 1-Stunden-Rundgang ist genau dafür da.", "Setz dich: Viele Säle haben Bänke. Im Sitzen schaut man länger.", "Fotos erst danach: Wer zuerst fotografiert, schaut weniger hin.", "Zu zweit oder als Familie: Jeder nennt ein Detail, das die anderen noch nicht gesehen haben.", "Mit Kindern: Spielt „Ich sehe was, was du nicht siehst“ – oder unser Spiel „Finde das Detail“."], "methh": "Woher die Methode kommt", "meth": "Die Schritte orientieren sich an zwei bewährten Ansätzen aus der Kunstvermittlung: der Routine „See, Think, Wonder“ (Sehen, Denken, Fragen) von Project Zero an der Harvard University und den „Visual Thinking Strategies“, die in vielen Museen und Schulen eingesetzt werden. Beide haben denselben Kern: erst genau beobachten, dann mit Belegen deuten, dann neugierig weiterfragen.", "try": "Probier es aus", "tryp": "Nimm dir den Bacchus von Caravaggio: Schau zuerst eine Minute, ohne etwas zu lesen. Dann spiel „Finde das Detail“.", "trybtn": "Zum Bacchus"}, "en": {"nav": "How to look", "tag": "Guide", "h": "How to really look at a painting", "lead": "In a study at the Metropolitan Museum in New York, visitors stood in front of a masterpiece for about 27 seconds on average – half of them for less than 17 seconds. In that time you see a painting, but you don't look at it. This guide helps you turn 17 seconds into five good minutes.", "steps": [["Look first, read later", "Ignore the label next to the painting at first. Otherwise you only look for what it tells you. Give yourself one minute of just looking."], ["Describe what is really there", "List in your head what you see: people, objects, colours, light. No interpretation yet, only facts. “A young man, a glass of wine, a bowl of fruit.”"], ["Let your eyes wander", "Step close, then step back. Look into the corners, the background, at hands and faces. Where are the figures looking? Where does the light fall? What is bright, what is in shadow?"], ["Ask: what is happening – and what makes me say that?", "Now you may interpret. But back it up with something you can see. “He is drunk – I can tell from his red cheeks and the tilted wine in his glass.”"], ["Notice what doesn't fit", "A neck that is too long, one figure who is the only one looking at you, rotten fruit in a splendid bowl: the strange thing is almost always intentional – and often the key to the whole painting."], ["What do I wonder?", "Ask yourself one open question. Why is she so pale? Why is he looking at us? With a question in mind you automatically look more closely."], ["Only now, read", "Read the label or the guide and compare it with your guesses. What did you get right? What did you miss? That comparison is what stays in your memory."], ["Take one detail home", "Remember a single detail you can tell someone later. That is all you need."]], "tipsh": "Tips for your museum visit", "tips": ["Less is more: better 5 paintings properly than 50 in passing. That is what the 1-hour tour is for.", "Sit down: many rooms have benches. Seated, you look longer.", "Photos afterwards: if you photograph first, you look less.", "In pairs or as a family: everyone names one detail the others haven't spotted yet.", "With children: play “I spy” – or our game “Find the detail”."], "methh": "Where the method comes from", "meth": "The steps are based on two proven approaches from art education: the “See, Think, Wonder” routine from Project Zero at Harvard University, and “Visual Thinking Strategies”, used in many museums and schools. Both share the same core: observe closely first, then interpret with evidence, then keep asking out of curiosity.", "try": "Try it", "tryp": "Take Caravaggio's Bacchus: look for one minute first, without reading anything. Then play “Find the detail”.", "trybtn": "Go to Bacchus"}, "ja": {"nav": "絵の見方", "tag": "ガイド", "h": "絵を本当に「見る」ための方法", "lead": "ニューヨークのメトロポリタン美術館での調査によると、来館者が名画の前に立つ時間は平均で約27秒、半数の人は17秒未満でした。その時間では、絵が目に入っても、本当に見たことにはなりません。このガイドで、17秒を充実した5分に変えてみましょう。", "steps": [["まず見る、読むのはあと", "最初は絵の横の解説パネルを読まないでください。読むと、そこに書かれていることだけを探してしまいます。1分間、ただ見ることに集中しましょう。"], ["実際にあるものを言葉にする", "見えるものを頭の中で挙げていきます。人物、物、色、光。まだ解釈はせず、事実だけ。「若い男性、ワインのグラス、果物の鉢」。"], ["目をさまよわせる", "近づいたり、離れたりしてみましょう。隅や背景、手や顔を見ます。人物はどこを見ている？光はどこに当たっている？明るいところと影はどこ？"], ["問いかける：何が起きている？なぜそう思う？", "ここで初めて解釈します。ただし、見えるものを根拠にしましょう。「彼は酔っている。赤い頬とグラスの中で傾いたワインからそう分かる」。"], ["「おかしな点」に気づく", "長すぎる首、一人だけこちらを見る人物、豪華な鉢の中の腐った果物。不自然なところはほとんどの場合わざとで、絵全体を解く鍵であることが多いのです。"], ["何が不思議？", "答えのない問いを一つ持ちましょう。なぜ彼女はあんなに青白い？なぜ彼はこちらを見ている？問いを持つと、自然とよく見るようになります。"], ["ここで初めて読む", "解説パネルやガイドを読み、自分の推測と比べます。何が当たっていた？何を見落とした？この比較こそが記憶に残ります。"], ["見どころを一つ持ち帰る", "あとで誰かに話せる見どころを一つだけ覚えておきましょう。それで十分です。"]], "tipsh": "美術館を訪れるときのヒント", "tips": ["少ないほど良い：50点を素通りするより、5点をしっかり。1時間ルートはそのためにあります。", "座る：多くの展示室にはベンチがあります。座ると長く見られます。", "写真はあとで：先に撮ると、あまり見なくなります。", "二人で、家族で：一人ずつ、他の人がまだ気づいていない見どころを挙げましょう。", "子どもと一緒に：「見つけたもの当てゲーム」や、私たちのゲーム「見どころを探せ」で遊んでみてください。"], "methh": "この方法の由来", "meth": "これらのステップは、美術教育で実績のある二つの方法に基づいています。ハーバード大学プロジェクト・ゼロの「See, Think, Wonder（見る・考える・問う）」と、多くの美術館や学校で使われている「ヴィジュアル・シンキング・ストラテジーズ（VTS）」です。どちらも核は同じ。まずよく観察し、根拠をもって解釈し、好奇心をもって問い続けることです。", "try": "やってみよう", "tryp": "カラヴァッジョの《バッカス》で試してみましょう。まず何も読まずに1分間見て、それから「見どころを探せ」で遊んでみてください。", "trybtn": "バッカスへ"}};

let world=null, dl=null;
async function drawMap(){
  const svg=d3.select("#map"); if(svg.empty()||typeof d3==="undefined")return;
  try{ if(!world){world=await (await fetch("world.json")).json();} }catch(e){return;}
  const proj=d3.geoNaturalEarth1().fitExtent([[10,10],[950,490]],{type:"Sphere"}); const path=d3.geoPath(proj);
  const g=svg.append("g");
  g.append("g").selectAll("path").data(topojson.feature(world,world.objects.countries).features).join("path").attr("class","land").attr("d",path);
  const pg=g.append("g");
  const pins=pg.selectAll("g").data(PINS).join("g").attr("class",d=>"pin "+(d.live?"live":"soon")).attr("transform",d=>`translate(${proj([d.lon,d.lat])})`);
  pins.filter(d=>d.live).append("circle").attr("class","halo").attr("r",5);
  pins.append("circle").attr("class","dot").attr("r",d=>d.live?5:3.2);
  pins.append("text").attr("x",7).attr("y",4).text(d=>pinName(d));
  pins.filter(d=>d.live).attr("tabindex",0).attr("role","link").on("click",(e,d)=>{location.hash=d.id}).on("keydown",(e,d)=>{if(e.key==="Enter")location.hash=d.id});
  const zoom=d3.zoom().scaleExtent([1,12]).translateExtent([[0,0],[960,500]]).on("zoom",e=>{g.attr("transform",e.transform);const k=e.transform.k;pins.attr("transform",d=>`translate(${proj([d.lon,d.lat])}) scale(${1/k})`);});
  svg.call(zoom).on("wheel.zoom",null);
  const toEurope=()=>{const [x,y]=proj([9,47]);const k=5.2;svg.transition().duration(matchMedia("(prefers-reduced-motion: reduce)").matches?0:700).call(zoom.transform,d3.zoomIdentity.translate(480-x*k,250-y*k).scale(k));};
  document.getElementById("z-eu").onclick=toEurope;
  document.getElementById("z-world").onclick=()=>svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity);
  toEurope();
}

const ZV={w:null,i:-1};
function zLayout(){
  const w=ZV.w; if(!w)return; const st=document.getElementById("zs"); const W=st.clientWidth,H=st.clientHeight;
  const base=Math.min(W/w.zw,H/w.zh); const iw=w.zw*base, ih=w.zh*base; const ox=(W-iw)/2, oy=(H-ih)/2;
  const zi=document.getElementById("zi"); zi.style.width=iw+"px"; zi.style.height=ih+"px";
  let k=1,cx=W/2,cy=H/2,tx=ox,ty=oy; const ring=document.getElementById("zring");
  if(ZV.i>=0){const p=w.pts[ZV.i]; const r=p[2]*Math.min(iw,ih); k=Math.max(1,Math.min(6,0.3*Math.min(W,H)/r))*zExtra; const px=p[0]*iw, py=p[1]*ih; tx=cx-px*k; ty=cy-py*k; const cl=(v,len,S)=>len*k<=S?(S-len*k)/2:Math.min(0,Math.max(S-len*k,v)); tx=cl(tx,iw,W); ty=cl(ty,ih,H);
    const R=r*k; ring.style.cssText=`left:${tx+px*k-R}px;top:${ty+py*k-R}px;width:${2*R}px;height:${2*R}px;opacity:1`;}
  else ring.style.opacity=0;
  zi.style.transform=`translate(${tx}px,${ty}px) scale(${k})`;
}
function zShow(){ zExtra=1;
  const w=ZV.w, x=UX[lang]; const n=w.pts.length;
  document.getElementById("zvt").textContent=w.name[lang]+(ZV.i>=0?` · ${ZV.i+1} ${x.of} ${n}`:"");
  document.getElementById("ztext").innerHTML=ZV.i>=0?w.details[lang][ZV.i]:w.story[lang];
  document.getElementById("zall").textContent=ZV.i>=0?(lang==="ja"?"全体":lang==="en"?"Whole picture":"Ganzes Bild"):(x.next);
  zLayout();
}
function zOpen(key,i){
  ZV.w=workByKey(key); ZV.i=i; ZV.last=document.activeElement;
  const img=document.getElementById("zimg"); img.src=ZV.w.zimg; img.alt=ZV.w.name[lang];
  document.getElementById("zv").hidden=false; document.body.style.overflow="hidden";
  ZV.i=-1; zShow(); requestAnimationFrame(()=>setTimeout(()=>{ZV.i=i;zShow();},60));
  document.getElementById("zclose").setAttribute("aria-label",UX[lang].close); document.getElementById("zclose").focus();
}
function zClose(){document.getElementById("zv").hidden=true;document.body.style.overflow="";ZV.w=null;ZV.last?.focus?.();}
function zStep(d){const n=ZV.w.pts.length; ZV.i=(ZV.i<0?(d>0?0:n-1):(ZV.i+d+n)%n); zShow();}
document.getElementById("zclose").onclick=zClose;
document.getElementById("zprev").onclick=()=>zStep(-1);
document.getElementById("znext").onclick=()=>zStep(1);
document.getElementById("zall").onclick=()=>{if(ZV.i>=0){ZV.i=-1;zShow();}else zStep(1);};
addEventListener("keydown",e=>{if(!ZV.w)return; if(e.key==="Escape")zClose(); if(e.key==="ArrowRight")zStep(1); if(e.key==="ArrowLeft")zStep(-1);});

async function pvVoices(key){
  const c=PV.ctx; if(!c||!VOX[key])return; let bufs=[];
  try{bufs=await Promise.all(VOX[key].map(async u=>c.decodeAudioData(await (await fetch(u)).arrayBuffer())));}catch(e){return;}
  let last=-1;
  const play=()=>{ if(!PV.ctx||PV.ctx!==c)return; let i; do{i=Math.floor(Math.random()*bufs.length);}while(bufs.length>1&&i===last); last=i;
    const src=c.createBufferSource(); src.buffer=bufs[i]; const g=c.createGain(); g.gain.value=0.55+Math.random()*0.25;
    let node=g; if(c.createStereoPanner){const pn=c.createStereoPanner(); pn.pan.value=(Math.random()*1.4-0.7); g.connect(pn); node=pn;}
    src.connect(g); node.connect(PV.out); src.start(); PV.vt=setTimeout(play,(bufs[i].duration*1000)+4000+Math.random()*7000); };
  PV.vt=setTimeout(play,2800);
}
function pvClose(){ clearTimeout(PV.vt); cancelAnimationFrame(PV.raf); PV.gl=null; clearTimeout(PV.chirp); if(PV.ctx){const c=PV.ctx;PV.ctx=null;try{PV.out.gain.linearRampToValueAtTime(0,c.currentTime+.4);setTimeout(()=>c.close(),500);}catch(_){}}
  document.getElementById("pv").hidden=true; document.body.style.overflow=""; }
document.getElementById("pvx").onclick=pvClose;
addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("pv").hidden)pvClose();});
(()=>{const cv=document.getElementById("pvc"); let drag=null;
  const idleLater=()=>{clearTimeout(PV.it);PV.it=setTimeout(()=>{PV.idle=true;PV.t0=performance.now();},5000);};
  cv.addEventListener("pointerdown",e=>{PV.idle=false;drag={x:e.clientX,y:e.clientY,yaw:PV.tyaw,pit:PV.tpit};try{cv.setPointerCapture(e.pointerId)}catch(_){};cv.style.cursor="grabbing";idleLater();});
  cv.addEventListener("pointermove",e=>{const b=cv.getBoundingClientRect(); PV.tx=(e.clientX-b.left)/b.width; PV.ty=(e.clientY-b.top)/b.height;
    if(drag){PV.idle=false; PV.tyaw=Math.max(-.62,Math.min(.62,drag.yaw-(e.clientX-drag.x)/b.width*1.6)); PV.tpit=Math.max(-.18,Math.min(.18,drag.pit+(e.clientY-drag.y)/b.height*.5)); idleLater();}
    else if(e.pointerType==="mouse"){PV.idle=false; PV.tyaw=(PV.tx-.5)*1.15; PV.tpit=(PV.ty-.5)*-.3; idleLater();}});
  const up=()=>{drag=null;cv.style.cursor="grab";}; cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
  addEventListener("keydown",e=>{if(document.getElementById("pv").hidden)return; if(e.key==="ArrowLeft"){PV.idle=false;PV.tyaw=Math.max(-.62,PV.tyaw-.12);idleLater();} if(e.key==="ArrowRight"){PV.idle=false;PV.tyaw=Math.min(.62,PV.tyaw+.12);idleLater();}});
})();
document.getElementById("app").addEventListener("click",e=>{ if(!night)return; const a=e.target.closest(".hang a.portal"); if(!a)return; e.preventDefault(); e.stopImmediatePropagation(); pvOpen(a.dataset.k,a); },true);

function wingSketch(){
  const pic=document.querySelector("#w-verkuendigung .pic"); if(!pic||!dusted||pic.querySelector(".wsk"))return;
  const svg=`<svg class="wsk" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M25 27 C23 21 20 20 17 22 C16 25 16.5 28 18 30 C20 32 23 33 25 31 Z" fill="rgba(232,199,112,.18)" stroke="#E8C770" stroke-width=".35" vector-effect="non-scaling-stroke"/><path d="M17 22 C14 21.5 11.5 22.5 9.5 25 C11.5 27 14 28.5 17.5 29.5" fill="rgba(0,0,0,.12)" stroke="#fff" stroke-width=".3" stroke-dasharray="1.2 1" vector-effect="non-scaling-stroke"/></svg>`;
  pic.insertAdjacentHTML("beforeend",svg);
  const fig=pic.closest("figure"); const u=UI[lang];
  fig.insertAdjacentHTML("beforeend",`<div class="wskbar"><span>${u.wingsk}</span><button type="button" id="wsktg">${u.wingoff}</button></div>`);
  document.getElementById("wsktg").onclick=e=>{const s=pic.querySelector(".wsk");s.hidden=!s.hidden;e.target.textContent=s.hidden?u.wingon:u.wingoff;};
}
